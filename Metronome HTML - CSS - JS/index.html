<!doctype html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/dot.css" />
    <link rel="stylesheet" href="styles/start.css" />
    <link rel="stylesheet" href="styles/compass.css" />
    <link rel="stylesheet" href="styles/sound.css" />
    <link rel="stylesheet" href="styles/timer.css" />
  </head>
  <body>
    <h1>METRONOME</h1>

    <div class="metronome-dot-container">
      <div class="metronome-dot"></div>
      <div class="metronome-dot"></div>
      <div class="metronome-dot"></div>
      <div class="metronome-dot"></div>
    </div>

    <div class="metronome-start-container">
      <p>Write BPM:</p>
      <div class="metronome-bpm-values-container">
        <input placeholder="Write BPM" class="metronome-bpm-input" value="90" />
        <p class="warning-bpm-messages"></p>
      </div>
      <button class="start-bpm-button" onclick="startMetronome()">Start</button>
    </div>

    <div class="metronome-compass-container">
      <p>Select compass:</p>
      <button
        class="compass-button four-button"
        onclick="handleToggleClass('four')"
      >
        4 / 4
      </button>
      <button
        class="compass-button three-button"
        onclick="handleToggleClass('three')"
      >
        3 / 4
      </button>
      <button
        class="compass-button twelve-button"
        onclick="handleToggleClass('twelve')"
      >
        12 / 8
      </button>
      <button
        class="compass-button six-button"
        onclick="handleToggleClass('six')"
      >
        6 / 8
      </button>
    </div>

    <div class="metronome-sound-effect-container">
      <p>Metronome Sound:</p>
      <select class="metronome-sound">
        <option>Default</option>
        <option>Softer</option>
        <option>Wood</option>
      </select>
      <button class="play-sound-effect-button">Play Effect</button>
    </div>

    <div class="metronome-timer-container">
      <p>Timer:</p>
      <input placeholder="Write time" class="timer-input" />
    </div>
    <script src="scripts/index.js"></script>
    <script src="scripts/start-functionality.js"></script>
    <script src="scripts/compass-functionality.js"></script>
  </body>
</html>
